# Situs NGINX server untuk AlurKerja (dipasang di /etc/nginx/sites-available/alurkerja). NGINX milik AlurKerja
# mendengar HTTP di 127.0.0.1:8100; HTTPS diakhiri di sini. Setelah dipasang:
#   sudo certbot --nginx -d alurkerja.ahlanapp.cloud -d minio.alurkerja.ahlanapp.cloud

map $http_upgrade $ak_connection {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name alurkerja.ahlanapp.cloud;

    client_max_body_size 100m;
    # Token masuk Keycloak panjang.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Alat dalam tidak dibuka ke internet. Mailpit memuat email (termasuk tautan sandi) tanpa login;
    # bacalah lewat terowongan: ssh -L 8105:127.0.0.1:8105 <server>  lalu http://localhost:8105/mailpit/
    location ~ ^/(mailpit|log|graylog|rustfs)(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ak_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name minio.alurkerja.ahlanapp.cloud;

    client_max_body_size 100m;

    location ^~ /rustfs/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
