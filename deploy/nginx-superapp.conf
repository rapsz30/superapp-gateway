# Situs NGINX server untuk superapp.ahlanapp.cloud (dipasang di /etc/nginx/sites-available/superapp).
# limit_req_zone harus didefinisikan di http{} (mis. /etc/nginx/nginx.conf):
#   limit_req_zone $binary_remote_addr zone=registrasi:10m rate=10r/m;
server {
    listen 80;
    server_name superapp.ahlanapp.cloud;

    client_max_body_size 22m;

    # Batas per IP asli pengunjung untuk registrasi (alamat terlihat di sini, bukan di gateway).
    location = /api/identity/auth/register {
        limit_req zone=registrasi burst=5 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;   # FRONTEND_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
