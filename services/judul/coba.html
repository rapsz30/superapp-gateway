<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot TA - Informatika</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet" />

    <style>
      body {
        background: #f5f5f5;
      }
      #chat-container {
        max-width: 800px;
        margin: 50px auto;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }
      #chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 10px 10px 0 0;
      }
      #chat-messages {
        height: 400px;
        overflow-y: auto;
        padding: 20px;
      }
      .message {
        margin: 10px 0;
        padding: 10px 15px;
        border-radius: 15px;
        max-width: 70%;
      }
      .user-message {
        background: #667eea;
        color: white;
        margin-left: auto;
        text-align: right;
      }
      .bot-message {
        background: #e9ecef;
        color: #333;
      }
      #chat-input-area {
        padding: 20px;
        border-top: 1px solid #dee2e6;
      }
      .typing-indicator {
        display: none;
        padding: 10px;
      }
      .typing-indicator span {
        height: 10px;
        width: 10px;
        background: #999;
        border-radius: 50%;
        display: inline-block;
        margin: 0 2px;
        animation: bounce 1.4s infinite ease-in-out both;
      }
      .typing-indicator span:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-indicator span:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div id="chat-header">
        <h3><i class="fas fa-robot"></i> Chatbot Assistant</h3>
        <small>Tugas Akhir - Sistem Informasi</small>
      </div>

      <div id="chat-messages">
        <div class="message bot-message"><i class="fas fa-robot"></i> Halo! Saya chatbot assistant. Ada yang bisa saya bantu?</div>
      </div>

      <div class="typing-indicator"><span></span><span></span><span></span></div>

      <div id="chat-input-area">
        <div class="input-group">
          <input type="text" id="user-input" class="form-control" placeholder="Ketik pesan Anda..." />
          <button class="btn btn-primary" onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Kirim</button>
        </div>
      </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>

    <script>
      const chatMessages = document.getElementById('chat-messages');
      const userInput = document.getElementById('user-input');
      const typingIndicator = document.querySelector('.typing-indicator');

      function addMessage(text, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;

        if (!isUser) {
          messageDiv.innerHTML = `<i class="fas fa-robot"></i> ${text}`;
        } else {
          messageDiv.innerHTML = `${text} <i class="fas fa-user"></i>`;
        }

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Tampilkan pesan user
        addMessage(message, true);
        userInput.value = '';

        // Tampilkan typing indicator
        typingIndicator.style.display = 'block';

        try {
          // Simulasi API call (ganti dengan endpoint backend kamu)
          const response = await axios.post('http://localhost:5000/api/chat', {
            message: message,
            timestamp: new Date().toISOString(),
          });

          // Sembunyikan typing indicator
          typingIndicator.style.display = 'none';

          // Tampilkan response bot
          addMessage(response.data.reply, false);
        } catch (error) {
          typingIndicator.style.display = 'none';

          // Fallback response jika API error
          addMessage('Maaf, saya sedang mengalami gangguan. Silakan coba lagi.', false);
          console.error('Error:', error);
        }
      }

      // Enter untuk kirim
      userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });

      // Auto focus input
      userInput.focus();
    </script>
  </body>
</html>
