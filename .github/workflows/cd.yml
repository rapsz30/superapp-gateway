name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: microcred-api
            context: ./services/microcred
            file: ./services/microcred/infra/docker/Dockerfile.api
            build_args: ""
          - service: microcred-worker
            context: ./services/microcred
            file: ./services/microcred/infra/docker/Dockerfile.worker
            build_args: ""
          - service: judul-api
            context: ./services/judul
            file: ./services/judul/Dockerfile
            build_args: ""
          - service: matkul
            context: ./services/matkul
            file: ./services/matkul/Dockerfile
            build_args: |
              NEXT_PUBLIC_POCKETBASE_URL=http://pocketbase:8090
              NEXT_PUBLIC_PB_URL=http://pocketbase:8090
          - service: pocketbase
            context: ./infra/pocketbase
            file: ./infra/pocketbase/Dockerfile
            build_args: ""
          - service: auth-verifier
            context: ./gateway/auth
            file: ./gateway/auth/Dockerfile
            build_args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/superapp-${{ matrix.service }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,prefix=

      - name: Build and push ghcr.io/<owner>/superapp-${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

