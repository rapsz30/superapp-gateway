worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sembunyikan versi NGINX
    server_tokens off;

    # Log akses ke stdout, dipakai untuk evaluasi waktu respons
    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       'rt=$request_time urt=$upstream_response_time '
                       'upstream=$upstream_addr';
    access_log /dev/stdout gateway;

    # Batas waktu baca body dari klien
    client_body_timeout 60s;

    # Satu upstream per layanan
    upstream matkul_upstream {
        server matkul:3000;
    }
    upstream judul_upstream {
        server judul-api:8001;
    }
    upstream microcred_upstream {
        server microcred-api:8000;
    }
    upstream auth_verifier {
        server auth-verifier:8100;
    }

    # CORS: hanya origin dev di bawah yang diizinkan (tanpa wildcard).
    # Origin frontend teman ditambahkan di sini, lalu restart nginx.
    map $http_origin $cors_origin {
        default                  "";
        "http://127.0.0.1:5500"  $http_origin;
        "http://localhost:5500"  $http_origin;
        "http://127.0.0.1:5173"  $http_origin;
        "http://localhost:5173"  $http_origin;
    }

    server {
        listen 80;
        server_name _;

        # Simpan URI dan method ternormalisasi milik request utama untuk verifier.
        # Aturan level server juga berjalan di subrequest /_auth ($uri = /_auth), jadi
        # hanya diisi pada request utama agar nilainya tidak tertimpa.
        if ($uri != "/_auth") {
            set $orig_uri $uri;
            set $orig_method $request_method;
        }

        # Batas default untuk lokasi non-upload
        client_max_body_size 1m;

        # --- Autentikasi terpusat: default tolak, rute publik memakai "auth_request off" ---
        auth_request off;
        auth_request_set $auth_user_id    $upstream_http_x_user_id;
        auth_request_set $auth_user_roles $upstream_http_x_user_roles;
        auth_request_set $auth_user_email $upstream_http_x_user_email;

        # Pengaturan proxy bersama. Semua proxy_set_header ada di level server karena
        # NGINX membuang seluruh pewarisan bila sebuah location punya proxy_set_header sendiri.
        # Di rute publik variabel X-User-* kosong, jadi header buatan klien tertimpa (tidak diteruskan).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $auth_user_id;
        proxy_set_header X-User-Roles      $auth_user_roles;
        proxy_set_header X-User-Email      $auth_user_email;
        proxy_connect_timeout 5s;

        # CORS dari gateway saja. Jangan menambah add_header di level location
        # (akan menghapus pewarisan header ini). Header CORS dari upstream dibuang.
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Vary                         Origin always;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # Preflight lolos tanpa token
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Halaman error JSON dari gateway (hanya error buatan NGINX, bukan dari upstream)
        error_page 401 @err_401;
        error_page 403 @err_403;
        error_page 413 @err_413;
        error_page 500 =503 @err_500;
        error_page 502 @err_502;
        error_page 503 @err_503;
        error_page 504 @err_504;

        location @err_401 {
            default_type application/json;
            return 401 '{"detail":"Token tidak ada atau tidak valid"}';
        }
        location @err_403 {
            default_type application/json;
            return 403 '{"detail":"Akses ditolak"}';
        }
        location @err_413 {
            default_type application/json;
            return 413 '{"detail":"Ukuran file melebihi batas"}';
        }
        # 500 buatan NGINX saat verifier tidak tersedia -> 503 (fail closed).
        # Error 500 dari aplikasi upstream tidak lewat sini (tanpa proxy_intercept_errors).
        location @err_500 {
            default_type application/json;
            return 503 '{"detail":"Layanan autentikasi tidak tersedia"}';
        }
        location @err_502 {
            default_type application/json;
            return 502 '{"detail":"Layanan tidak tersedia"}';
        }
        location @err_503 {
            default_type application/json;
            return 503 '{"detail":"Layanan tidak tersedia"}';
        }
        location @err_504 {
            default_type application/json;
            return 504 '{"detail":"Layanan tidak tersedia"}';
        }

        # Subrequest verifikasi token (hanya internal)
        location = /_auth {
            internal;
            proxy_pass http://auth_verifier/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # Subrequest mewarisi Content-Length request utama; jangan tolak upload besar di sini
            client_max_body_size 0;
            proxy_set_header X-Original-URI $orig_uri;
            proxy_set_header X-Original-Method $orig_method;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        # Health check gateway (publik)
        location = /healthz {
            auth_request off;
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # --- Rute publik Micro-cred (tanpa token) ---
        location = /api/micro-cred/auth/register {
            auth_request off;
            default_type application/json;
            if ($request_method != POST) {
                return 405 '{"detail":"Method not allowed"}';
            }
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/micro-cred/$1;
            proxy_redirect ~^/(.*)$ /api/micro-cred/$1;
            proxy_pass http://microcred_upstream/auth/register;
        }
        location = /api/micro-cred/auth/login {
            auth_request off;
            default_type application/json;
            if ($request_method != POST) {
                return 405 '{"detail":"Method not allowed"}';
            }
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/micro-cred/$1;
            proxy_redirect ~^/(.*)$ /api/micro-cred/$1;
            proxy_pass http://microcred_upstream/auth/login;
        }
        location = /api/micro-cred/health {
            auth_request off;
            default_type application/json;
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405 '{"detail":"Method not allowed"}';
            }
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/micro-cred/$1;
            proxy_redirect ~^/(.*)$ /api/micro-cred/$1;
            proxy_pass http://microcred_upstream/health;
        }

        # --- Rute terproteksi (wajib token; kebijakan role di verifier) ---

        # Matkul: hanya rute API. /api/matkul-recommender/x -> /api/x
        location /api/matkul-recommender/ {
            client_max_body_size 16m;   # batas aplikasi 15 MB + overhead multipart
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            # Pertahankan prefix pada redirect dari upstream
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/matkul-recommender/$1;
            proxy_redirect ~^/(.*)$ /api/matkul-recommender/$1;
            proxy_pass http://matkul_upstream/api/;
        }

        # Judul: /api/judul-recommender/x -> /x
        location /api/judul-recommender/ {
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/judul-recommender/$1;
            proxy_redirect ~^/(.*)$ /api/judul-recommender/$1;
            proxy_pass http://judul_upstream/;
        }

        # Micro-cred: /api/micro-cred/x -> /x
        location /api/micro-cred/ {
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect ~^https?://[^/]+/(.*)$ /api/micro-cred/$1;
            proxy_redirect ~^/(.*)$ /api/micro-cred/$1;
            proxy_pass http://microcred_upstream/;
        }

        # Path lain -> 404 JSON (tanpa token tetap 401: default tolak)
        location / {
            default_type application/json;
            return 404 '{"detail":"Not found"}';
        }
    }
}
